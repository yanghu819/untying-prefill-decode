
tag:
  - longbench_local
task: lbl_lcc
dataset_path: json
test_split: test
doc_to_text: 'Please complete the code given below. \n{{context}}Next line of code:\n'
doc_to_target: '{{answers}}'
process_results: !function metrics.get_code_sim_score
generation_kwargs:
  max_gen_toks: 64
  temperature: 0
  do_sample: false
  until: []
metric_list:
  - metric: "code_sim_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 3.0
dataset_kwargs:
  data_files:
    test: /dev/shm/big-small-ouro/longbench-data/data/lcc.jsonl
