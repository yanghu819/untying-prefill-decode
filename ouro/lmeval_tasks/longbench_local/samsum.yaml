
tag:
  - longbench_local
task: lbl_samsum
dataset_path: json
test_split: test
doc_to_text: 'Summarize the dialogue into a few short sentences. The following are some examples.\n\n{{context}}\n\n{{input}}'
doc_to_target: '{{answers}}'
process_results: !function metrics.get_rouge_score
generation_kwargs:
  max_gen_toks: 128
  temperature: 0
  do_sample: false
  until: ["\n"]
metric_list:
  - metric: "rouge_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 3.0
dataset_kwargs:
  data_files:
    test: /dev/shm/big-small-ouro/longbench-data/data/samsum.jsonl
