
tag:
  - longbench_local
task: lbl_gov_report
dataset_path: json
test_split: test
doc_to_text: 'You are given a report by a government agency. Write a one-page summary of the report.\n\nReport:\n{{context}}\n\nNow, write a one-page summary of the report.\n\nSummary:'
doc_to_target: '{{answers}}'
process_results: !function metrics.get_rouge_score
generation_kwargs:
  max_gen_toks: 512
  temperature: 0
  do_sample: false
  until: []
metric_list:
  - metric: "rouge_score"
    aggregation: mean
    higher_is_better: True
metadata:
  version: 3.0
dataset_kwargs:
  data_files:
    test: /dev/shm/big-small-ouro/longbench-data/data/gov_report.jsonl
